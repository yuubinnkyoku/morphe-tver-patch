name: Release

# Avoid concurrent semantic-release pushes of git notes and tags.
concurrency:
  group: morphe-release-publishing
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # One-time repair: dev.3 was tagged during a failed release, but never
      # published. Remove only that exact orphan so semantic-release can retry.
      - name: Repair orphaned dev.3 prerelease tag
        if: github.ref_name == 'dev'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.0-dev.3" >/dev/null 2>&1; then
            echo "dev.3 release exists; leaving its tag untouched"
            exit 0
          fi
          existing="$(git ls-remote --tags origin refs/tags/v1.1.0-dev.3 | awk '{print $1}')"
          if [ -z "$existing" ]; then
            echo "No orphan tag to repair"
            exit 0
          fi
          if [ "$existing" != "164e2e7d73f3dce4b85da36e1d62992bf7d9c991" ]; then
            echo "::error::dev.3 tag has changed; refusing to delete it"
            exit 1
          fi
          git push origin :refs/tags/v1.1.0-dev.3
          git tag -d v1.1.0-dev.3
          echo "Removed orphaned dev.3 tag only"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Semantic release runs its own Gradle build command.
      # Only dev and main branch will generate a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Always verify compilation when semantic-release did not publish a release.
      # This covers non-main/dev branches, chore commits, docs commits, etc.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon
